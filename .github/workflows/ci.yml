name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run Tests
      run: npm run test

    - name: Build Next.js app
      run: npm run build
      env:
        # Dummy environment variables needed for Next.js build if any components require them at build time
        NEXT_PUBLIC_SUPABASE_URL: "https://dummy-url.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
